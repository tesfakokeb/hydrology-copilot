[project]
name = "hydrology-science"
version = "1.0.0"
description = "Hydrology Copilot — Python scientific service (machine-learning forecasting, geospatial and dataset profiling)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Gradient boosting and deep learning. Kept optional so the service starts and
# is useful on a machine without them; every endpoint reports which libraries
# it actually had available.
boosting = ["xgboost>=2.0", "lightgbm>=4.3"]
deep = ["torch>=2.2"]
geo = ["geopandas>=1.0", "rasterio>=1.3", "xarray>=2024.3", "netCDF4>=1.6", "pyarrow>=16.0", "openpyxl>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
