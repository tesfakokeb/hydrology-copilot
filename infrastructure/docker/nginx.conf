# Front door: static frontend, API, WebSocket and API documentation on one origin.
#
# Serving the SPA and the API from the same origin removes the CORS surface
# entirely and keeps the access token out of any cross-origin request.

upstream hydro_api {
  server backend:4000;
}

upstream hydro_web {
  server frontend:80;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 210M;   # matches the API's 200 MB upload limit
  proxy_read_timeout 300s;     # long enough for a model calibration request

  # Security headers. A strict CSP is deliberate: the application loads no
  # third-party scripts, fonts or map tiles by default.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location /api/ {
    proxy_pass http://hydro_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /docs {
    proxy_pass http://hydro_api;
    proxy_set_header Host $host;
  }

  location /ws {
    proxy_pass http://hydro_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    proxy_pass http://hydro_web;
    proxy_set_header Host $host;
  }
}
