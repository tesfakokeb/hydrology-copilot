# Static asset server for the built SPA. The outer nginx (nginx.conf) is the
# front door; this one only serves files and handles client-side routing.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are immutable; index.html must never be cached or a
  # deploy leaves clients on a stale bundle.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
